server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Keine Versionsnummer im Server-Header
    server_tokens off;

    # Health-Endpoint für die Kubernetes-Probes, ohne das Access-Log zu fluten
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Dieselben drei Schriftfamilien wie auf nyrvex.com (Archivo, IBM Plex
    # Mono, Source Serif 4), lokal ausgeliefert. Der Dateiname nennt Familie,
    # Schnitt und Subset; eine neue Fassung kaeme unter neuem Namen. Deshalb
    # immutable — ohne diesen Block fielen die woff2 unter das no-cache von
    # "location /" und jeder Seitenaufruf zoege ein halbes Megabyte Schrift neu.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # og.png und favicon.svg. Eine Stunde, nicht laenger: beide erscheinen
    # nach einer Ueberarbeitung unter demselben Dateinamen, und ein Tag Cache
    # hat auf der Schwesterseite schon dazu gefuehrt, dass Besucher die alte
    # Fassung sahen.
    location ~* \.(webp|png|jpg|svg)$ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # HTML nie cachen. Sonst sieht ein wiederkehrender Besucher nach einem
    # Deploy weiter die alte Seite, und niemand versteht warum.
    # $uri.html macht /impressum und /datenschutz auch ohne Endung erreichbar;
    # die Seiten selbst verlinken zwar mit .html, geteilte Links tun das nicht
    # immer.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript image/svg+xml;
}
