server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Keine Versionsnummer im Server-Header
    server_tokens off;

    # Health-Endpoint für die Kubernetes-Probes, ohne das Access-Log zu fluten
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Bewusst KEIN /fonts/-Block wie auf thomaszachmann.de: diese Seite setzt
    # ausschliesslich Systemschriften ein. Kein Webfont heisst kein Request,
    # kein Ladezustand ohne Text und nichts, was gecacht werden muesste.

    # Umschlagbilder. Eine Stunde, nicht laenger: Ein neuer Umschlag erscheint
    # unter demselben Dateinamen, und ein Tag Cache hat auf der Schwesterseite
    # schon dazu gefuehrt, dass Besucher die alte Fassung sahen.
    location ~* \.(pdf|webp|png|jpg|svg)$ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # HTML nie cachen. Sonst sieht ein wiederkehrender Besucher nach einem
    # Deploy weiter die alte Seite, und niemand versteht warum.
    # $uri.html macht /vault-in-practice erreichbar, ohne dass die Endung im
    # geteilten Link steht; das canonical der Seite zeigt auf genau diese Form.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript image/svg+xml;
}
