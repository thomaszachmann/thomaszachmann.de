server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Keine Versionsnummer im Server-Header
    server_tokens off;

    # Health-Endpoint für die Kubernetes-Probes, ohne das Access-Log zu fluten
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Self-hosted Fonts sind unveraenderlich: aggressiv cachen.
    # Bewusst KEINE expires-Direktive daneben: die erzeugt einen eigenen
    # Cache-Control-Header, und zwei davon nebeneinander sind mehrdeutig.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Downloads und Bilder. Eine Stunde, nicht laenger: Buch und Umschlag
    # erscheinen bei einer neuen Auflage unter demselben Dateinamen. Ein Tag
    # Cache hat beim ersten Austausch dazu gefuehrt, dass die Seite den alten
    # Umschlag mit falscher Seitenzahl zeigte — beim PDF haette es eine
    # Fassung ohne Lizenzseite ausgeliefert. Der Cache bringt hier ohnehin
    # wenig: ein Buch laedt man einmal herunter, nicht wiederholt.
    location ~* \.(pdf|webp|png|jpg|svg)$ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # HTML nie cachen. Sonst sieht ein wiederkehrender Besucher nach einem
    # Deploy weiter die alte Seite, und niemand versteht warum.
    # $uri.html macht /buch erreichbar, ohne dass die Endung im geteilten Link
    # steht; das <link rel="canonical"> der Seite zeigt auf genau diese Form.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript image/svg+xml;
    # woff2 ist intern schon komprimiert. Erneutes gzip kostet CPU und
    # bringt keine Bytes, deshalb steht font/woff2 hier nicht.
}
