apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nyrvex-de
  namespace: web-nyrvex-de
  annotations:
    # Namespace-Prefix und @kubernetescrd sind Pflicht. Funktioniert nur, weil
    # Traefik mit providers.kubernetesCRD.allowCrossNamespace: true laeuft.
    #
    # security-headers wird geteilt: die CSP dort erlaubt zusaetzlich
    # connect-src und form-action auf formcarry.com. Diese Seite nutzt beides
    # nicht - eine Erlaubnis, von der kein Gebrauch gemacht wird, oeffnet
    # nichts. Eine eigene, engere Middleware waere sauberer und ist als
    # Folgearbeit notiert.
    traefik.ingress.kubernetes.io/router.middlewares: >-
      traefik-security-headers@kubernetescrd,traefik-www-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - nyrvex.de
        - www.nyrvex.de
      secretName: nyrvex-de-tls
  rules:
    - host: nyrvex.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nyrvex-de
                port:
                  name: http
    - host: www.nyrvex.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nyrvex-de
                port:
                  name: http
