apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: thomaszachmann-tls
  namespace: web-thomaszachmann
spec:
  secretName: thomaszachmann-tls
  issuerRef:
    kind: ClusterIssuer
    # Zunaechst Staging. Task 8 stellt auf letsencrypt-prod um. Vorher nicht
    # aendern: das Rate-Limit von fuenf Zertifikaten pro Domain und Woche
    # ist echt.
    name: letsencrypt-staging
  commonName: thomaszachmann.de
  dnsNames:
    - thomaszachmann.de
    - www.thomaszachmann.de
