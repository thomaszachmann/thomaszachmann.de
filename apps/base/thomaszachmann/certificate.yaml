apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: thomaszachmann-tls
  namespace: web-thomaszachmann
spec:
  secretName: thomaszachmann-tls
  issuerRef:
    kind: ClusterIssuer
    # Produktivzertifikat. Die Staging-Ausstellung hat am 2026-08-27
    # funktioniert, damit ist die DNS-01-Kette ueber die Cloudflare-API belegt.
    # Vor Aenderungen an den dnsNames wieder auf letsencrypt-staging wechseln -
    # fuenf Ausstellungen pro Domain und Woche.
    name: letsencrypt-prod
  commonName: thomaszachmann.de
  dnsNames:
    - thomaszachmann.de
    - www.thomaszachmann.de
