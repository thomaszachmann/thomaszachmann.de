apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base/thomaszachmann
  - ../base/nyrvex
  - ../base/nyrvex-de

# Diesen Digest schreibt ausschliesslich GitHub Actions. Digest statt Tag, weil
# ein Tag verschiebbar ist: so steht im Repo exakt das, was laeuft.
#
# Der Wert unten ist ein Platzhalter aus Nullen - syntaktisch gueltig, aber
# garantiert nicht existent. Bis der erste Pipeline-Lauf ihn ersetzt, kann der
# Pod das Image nicht ziehen. Das ist kein Rueckschritt: apps war vorher
# ohnehin nicht bereit, und die Website ist noch nicht live.
# Ab zwei Eintraegen darf der Digest nicht mehr per "erste digest-Zeile"
# gesetzt werden. Die Pipeline sucht deshalb den name-Eintrag und ersetzt
# genau die digest-Zeile darunter.
images:
  - name: ghcr.io/thomaszachmann/thomaszachmann
    digest: sha256:6a1391519ed4273a9d41e56c8aec435b0031f7d4965a49088ed1e585f0ac878b
  - name: ghcr.io/thomaszachmann/nyrvex
    # Platzhalter aus Nullen wie beim ersten Eintrag: syntaktisch gueltig,
    # garantiert nicht existent. Der erste Pipeline-Lauf ersetzt ihn.
    digest: sha256:e5635d66d7c7e6cda0bf90912b58c1f4c0ec277ef5ce981b64636f080ce708c2
  - name: ghcr.io/thomaszachmann/nyrvex-de
    # Platzhalter aus Nullen: syntaktisch gueltig, garantiert nicht existent.
    # Der erste Pipeline-Lauf fuer sites/nyrvex-de/ ersetzt ihn. Bis dahin
    # kann der Pod das Image nicht ziehen - gewollt, denn nyrvex.de ist noch
    # nicht ausgerollt.
    digest: sha256:d9a1419143c6df606d7242c9709ee82abd9573e27620e60fd40e1f4561a96d74
