# Zentral im Traefik-Namespace, damit Nyrvex spaeter dieselben Regeln bekommt,
# ohne sie zu duplizieren. Funktioniert, weil Traefik mit
# providers.kubernetesCRD.allowCrossNamespace: true laeuft.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: traefik
spec:
  headers:
    frameDeny: true
    contentTypeNosniff: true
    referrerPolicy: "strict-origin-when-cross-origin"
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    forceSTSHeader: true
    # Die Seite laedt keinerlei externe Ressourcen: Fonts sind self-hosted,
    # das Favicon ist eine data:-URI. Deshalb kann default-src 'none' sein.
    # 'unsafe-inline' ist noetig, weil CSS und ein Script inline in der
    # index.html stehen. Das Auslagern in externe Dateien wuerde das
    # entfernen - notiert als Folgearbeit, aendert aber Website-Inhalt.
    contentSecurityPolicy: >-
      default-src 'none';
      img-src 'self' data:;
      style-src 'self' 'unsafe-inline';
      script-src 'self' 'unsafe-inline';
      font-src 'self';
      base-uri 'none';
      form-action 'none';
      frame-ancestors 'none'
    permissionsPolicy: "geolocation=(), microphone=(), camera=()"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: www-redirect
  namespace: traefik
spec:
  # Kanonisch ist die Apex-Domain - passend zum canonical der Seiten.
  #
  # Domain-unabhaengig statt fest auf thomaszachmann.de: die Middleware wird
  # von allen Ingresses geteilt, aber die alte Regex traf nur eine Domain.
  # Folge, gemessen am 2026-09-09: www.thomaszachmann.de antwortete mit 308,
  # www.nyrvex.com dagegen mit 200 - dieselbe Seite unter zwei Hosts. Mit
  # nyrvex.de waere das die dritte Domain mit demselben Fehler.
  #
  # Greift nur, wo ein Ingress den www-Host auch annimmt; ein fremder
  # Host-Header laeuft vorher ins Leere.
  redirectRegex:
    regex: "^https://www\\.(.+)"
    replacement: "https://${1}"
    permanent: true
