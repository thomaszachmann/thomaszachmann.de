name: build-site

on:
  push:
    branches: [main]
    paths:
      # 'sites/**' statt einer Liste je Site: eine neue Site soll nicht daran
      # scheitern, dass jemand vergisst, hier eine Zeile zu ergaenzen. Welche
      # Site dann tatsaechlich gebaut wird, entscheidet der Job "changed".
      - 'sites/**'
      - 'scripts/verify-assets.sh'
      - '.github/workflows/build-site.yaml'
  workflow_dispatch:

# Zwei gleichzeitige Laeufe wuerden sich beim Digest-Rueckschreiben gegenseitig
# ueberholen. Nicht abbrechen, sondern anstellen.
concurrency:
  group: build-site
  cancel-in-progress: false

permissions:
  contents: write    # fuer den Digest-Commit
  packages: write    # fuer den Push nach GHCR
  # Bewusst keine weiteren Rechte. Dieser Workflow deployt nicht - das macht
  # Flux, und Flux liest das Repo mit einem read-only Deploy-Key.

jobs:
  # Ermittelt, welche Sites gebaut werden muessen.
  #
  # Ohne diesen Schritt baut die Matrix immer alle Sites. Das erzeugt auch fuer
  # die unveraenderte Site einen neuen Digest - ein Docker-Build ist nicht
  # bit-reproduzierbar - und damit einen ueberfluessigen Rollout. Beobachtet am
  # 2026-09-01: ein Push, der nur nyrvex betraf, hat thomaszachmann.de von
  # 048cb6a7 auf d1f6e357 gehoben, ohne dass sich an der Seite etwas geaendert
  # hatte.
  #
  # Bewusst ohne dorny/paths-filter: der Workflow kommt sonst mit
  # actions/checkout und den offiziellen docker/*-Actions aus, und die paar
  # Zeilen Shell sind leichter zu pruefen als eine weitere fremde Action.
  changed:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.detect.outputs.sites }}
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v5
        with:
          # Vollstaendige Historie: der Vergleichspunkt aus github.event.before
          # liegt in einem flachen Clone sonst nicht vor.
          fetch-depth: 0

      - name: Geaenderte Sites ermitteln
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          alle() {
            # Liste aus dem Dateisystem, nicht aus einer gepflegten Konstante.
            # Bewusst kein "find -printf": das ist GNU-spezifisch und liesse
            # sich lokal auf macOS nicht gegenpruefen.
            for d in sites/*/; do basename "$d"; done | sort | jq -R . | jq -s -c .
          }

          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "Kein push-Event (${GITHUB_EVENT_NAME}) - alle Sites bauen."
            SITES="$(alle)"
          elif [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # Erster Push auf den Branch, Force-Push oder ein Vergleichspunkt,
            # den es nicht mehr gibt. Im Zweifel alles bauen.
            echo "Vergleichspunkt '${BEFORE}' nicht verwendbar - alle Sites bauen."
            SITES="$(alle)"
          else
            CHANGED="$(git diff --name-only "${BEFORE}" "${GITHUB_SHA}")"
            echo "--- geaenderte Dateien ---"
            echo "${CHANGED}"

            if echo "${CHANGED}" | grep -qE '^(scripts/verify-assets\.sh|\.github/workflows/build-site\.yaml)$'; then
              # Beides betrifft jede Site: der Pruefer entscheidet ueber jeden
              # Build, und eine Aenderung am Workflow soll sich sofort auf allen
              # Sites zeigen und nicht erst beim naechsten Inhaltsupdate.
              echo "Pruefskript oder Workflow geaendert - alle Sites bauen."
              SITES="$(alle)"
            else
              # Nur Verzeichnisse, die es noch gibt: eine geloeschte Site darf
              # keinen Build ausloesen, der dann am fehlenden Kontext scheitert.
              SITES="$(echo "${CHANGED}" \
                | sed -nE 's|^sites/([^/]+)/.*|\1|p' \
                | sort -u \
                | while read -r s; do [ -d "sites/${s}" ] && echo "${s}"; done \
                | jq -R . | jq -s -c .)"
            fi
          fi

          echo "sites=${SITES}" >> "$GITHUB_OUTPUT"
          echo "Zu bauen: ${SITES}"

  build:
    needs: changed
    # Leere Matrix ist bei GitHub Actions ein Fehler, kein No-op.
    if: needs.changed.outputs.sites != '[]' && needs.changed.outputs.sites != ''
    runs-on: ubuntu-latest
    strategy:
      # Zwingend 1. Die Matrix-Jobs schreiben beide einen Digest-Commit nach
      # main; parallel wuerde der zweite Push als non-fast-forward abgewiesen.
      # Die concurrency-Gruppe oben serialisiert nur Workflow-Laeufe
      # untereinander, nicht die Jobs innerhalb eines Laufs.
      max-parallel: 1
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.changed.outputs.sites) }}

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v5

      # Der erste Schritt ist der Test, nicht der Build: ein fehlender Font
      # soll die Pipeline stoppen, bevor irgendetwas gebaut oder gepusht wird.
      - name: Referenzierte Assets pruefen
        run: ./scripts/verify-assets.sh sites/${{ matrix.site }}/public

      # GHCR akzeptiert nur kleingeschriebene Pfade. Ein Owner mit
      # Grossbuchstaben laesst den Push sonst mit einer irrefuehrenden
      # Fehlermeldung scheitern.
      - name: Owner kleinschreiben
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: An GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und pushen
        id: build
        uses: docker/build-push-action@v6
        with:
          context: sites/${{ matrix.site }}
          # ubuntu-latest ist amd64, genau wie der CX33. Kein --platform noetig.
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.site }}:${{ github.sha }}
          # Cache je Site trennen, sonst verdraengen sich die Laeufe gegenseitig.
          cache-from: type=gha,scope=${{ matrix.site }}
          cache-to: type=gha,mode=max,scope=${{ matrix.site }}

      - name: Digest ins Repo zurueckschreiben
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.site }}
          SITE: ${{ matrix.site }}
        run: |
          set -euo pipefail

          if [ -z "${DIGEST}" ]; then
            echo "Kein Digest vom Build-Schritt erhalten." >&2
            exit 1
          fi
          echo "Image:  ${IMAGE}"
          echo "Digest: ${DIGEST}"

          # Frueher stand hier ein sed auf die erste digest-Zeile. Mit zwei
          # Images haette das beide Eintraege ueberschrieben und die jeweils
          # andere Site auf ein falsches Image gezeigt. Deshalb wird jetzt der
          # zum Image gehoerende name-Eintrag gesucht und genau die digest-Zeile
          # darunter ersetzt - Kommentarzeilen dazwischen eingeschlossen.
          python3 - "${IMAGE}" "${DIGEST}" <<'PY'
          import re, sys
          image, digest = sys.argv[1], sys.argv[2]
          path = "apps/prod/kustomization.yaml"
          text = open(path, encoding="utf-8").read()
          pattern = re.compile(
              r"(- name: " + re.escape(image) + r"\n(?:[ \t]*#[^\n]*\n)*[ \t]*digest: )\S+"
          )
          new, count = pattern.subn(lambda m: m.group(1) + digest, text, count=1)
          if count != 1:
              sys.exit(f"Kein digest-Eintrag fuer {image} in {path} gefunden.")
          open(path, "w", encoding="utf-8").write(new)
          PY

          echo "--- aktuelle Eintraege ---"
          grep -n -A1 'name: ghcr.io' apps/prod/kustomization.yaml

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/prod/kustomization.yaml

          if git diff --cached --quiet; then
            echo "Digest unveraendert - nichts zu committen."
            exit 0
          fi

          # [skip ci] ist Guertel und Hosentraeger: der paths-Filter oben wuerde
          # diesen Commit ohnehin nicht triggern, weil er nur apps/ beruehrt.
          git commit -m "chore(deploy): ${SITE} auf ${DIGEST} [skip ci]"

          # Noetig seit der Matrix: laeuft mehr als eine Site, hat die zweite
          # ausgecheckt, bevor die erste ihren Digest-Commit gepusht hat. Ohne
          # Rebase scheitert deren Push als non-fast-forward.
          git pull --rebase origin main
          git push
