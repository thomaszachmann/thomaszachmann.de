apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  # Kurzes Intervall: das ist der Pfad, ueber den ein Deploy ankommt.
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./apps/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Bewusst KEIN wait: true. Das wuerde Flux auch auf das Certificate warten
  # lassen - und das haengt an Lets Encrypt, also an einem externen Dienst mit
  # eigenem Tempo und eigenen Rate-Limits. Jeder Reconcile lief dadurch fuenf
  # Minuten in den Timeout, und solange wurde nichts anderes angewendet.
  #
  # Gegated wird auf das, was Flux tatsaechlich kontrolliert: laeuft die Site.
  # Der Zustand des Zertifikats ist ueber die Certificate-Ressource sichtbar,
  # er muss nicht den Rollout blockieren.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: thomaszachmann
      namespace: web-thomaszachmann
